# -- MeteSec theme options --

colorScheme = "noir"
defaultAppearance = "dark"
autoSwitchAppearance = true

enableSearch = true
enableCodeCopy = true
enableA11y = true
enableStructuredBreadcrumbs = true
highlightCurrentMenuArea = true
mainSections = ["posts"]
defaultBackgroundImage = "img/background.svg"
defaultSocialImage = "img/background.svg"
linkedinURL = "https://www.linkedin.com/in/mete-demirci-011057253"
githubURL = "https://github.com/metesec"
# Add these URLs once the external accounts are ready. Their UI is already
# implemented and appears automatically when a value is configured.
newsletterURL = ""
kofiURL = ""

[header]
  layout = "fixed"

[footer]
  showMenu = true
  showCopyright = true
  showThemeAttribution = true
  showAppearanceSwitcher = true
  showScrollToTop = true

[homepage]
  layout = "background"
  homepageImage = "img/background.svg"
  showRecent = true
  showRecentItems = 6
  showMoreLink = true
  showMoreLinkDest = "/posts/"
  cardView = true
  cardViewScreenWidth = false
  layoutBackgroundBlur = true

[article]
  showDate = true
  showViews = false
  showLikes = false
  showDateUpdated = true
  showAuthor = true
  showHero = true
  heroStyle = "basic"
  showBreadcrumbs = true
  showDraftLabel = true
  showEdit = false
  editAppendPath = true
  seriesOpened = false
  showHeadingAnchors = true
  showPagination = true
  invertPagination = false
  showReadingTime = true
  showTableOfContents = true
  showTaxonomies = true
  showAuthorsBadges = false
  showWordCount = true
  showSummary = true
  showRelatedContent = true
  relatedContentLimit = 3
  sharingLinks = ["linkedin", "reddit", "email"]
  showComments = false
  showZenMode = true

[list]
  showBreadcrumbs = true
  showSummary = true
  showTableOfContents = false
  showCards = true
  groupByYear = false
  cardView = true
  cardViewScreenWidth = false

[sitemap]
  excludedKinds = []

[taxonomy]
  showTermCount = true

[firebase]
  # apiKey = ""

[fathomAnalytics]
  # site = ""

[verification]
  # google = ""
  # bing = ""

[comments]
  enabled = false
  provider = "giscus"
  repo = "metesec/metesec.github.io"
  repoId = ""
  category = "Announcements"
  categoryId = ""

