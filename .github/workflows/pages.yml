name: Build and deploy MeteSec

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Hugo setup
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 0.164.0
          extended: true

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo --minify --panicOnWarning -d ./public --baseURL https://metesec.github.io/

      - name: Verify publishing experience
        run: |
          test -s public/posts/index.html
          test -s public/posts/the-long-way-around/index.html
          test -s public/editorial-policy/index.html
          test -s public/privacy/index.html
          test -s public/index.xml
          test -s public/sitemap.xml
          grep -q 'class=writing-hero' public/posts/index.html
          grep -q 'id=reading-progress' public/posts/the-long-way-around/index.html
          grep -q 'application/ld+json' public/posts/the-long-way-around/index.html
          grep -q 'rel=canonical' public/posts/the-long-way-around/index.html
          if grep -R -E '<a[^>]+href=(""|$)' public --include='*.html'; then
            echo "Empty links found in generated HTML"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: https://metesec.github.io/
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
