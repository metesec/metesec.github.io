{{ with resources.Get "js/metesec.js" }}
  {{ $script := . | resources.Minify | resources.Fingerprint "sha512" }}
  <script defer src="{{ $script.RelPermalink }}" integrity="{{ $script.Data.Integrity }}"></script>
{{ end }}
{{ with site.Params.goatcounterCode }}
  <script data-goatcounter="https://{{ . }}.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
{{ end }}
